<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Colonization - Interactive Growth</title>
    <style>
        /* Lock the viewport to prevent mobile browser scroll glitches */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            touch-action: none;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: fixed; 
        }

        canvas {
            display: block;
        }

        /* Subtle hint at the top */
        #top-hint {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        /* Unified Bottom-Left UI Container */
        #ui-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 340px;
            max-width: calc(100vw - 48px);
            z-index: 10;
            pointer-events: none; /* Let clicks pass through empty space */
        }

        /* The floating toolbar dock */
        #toolbar {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .dock-btn {
            background: rgba(15, 15, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: white;
            padding: 14px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .dock-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 230, 255, 0.4);
        }

        .dock-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        .dock-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #btn-toggle {
            flex-grow: 1;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .toggle-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 52px;
            flex-shrink: 0;
            color: rgba(100, 230, 255, 0.8);
        }

        #chevron {
            transition: transform 0.3s ease;
            color: rgba(255, 255, 255, 0.5);
        }

        #ui-container.panel-open #chevron {
            transform: rotate(180deg);
        }

        /* The expandable prompt panel */
        #panel-content {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 0;
            width: 100%;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            box-sizing: border-box;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            pointer-events: auto;
            
            /* Animation properties */
            transform-origin: bottom left;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        #panel-content.collapsed {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            visibility: hidden;
        }

        textarea#env-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.3s, background 0.3s;
            resize: none;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        
        textarea#env-input:focus {
            outline: none;
            border-color: rgba(100, 230, 255, 0.6);
            background: rgba(0, 0, 0, 0.7);
        }

        textarea#env-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #mutate-btn {
            width: 100%;
            padding: 12px;
            background: rgba(100, 230, 255, 0.15);
            color: #8ce8ff;
            border: 1px solid rgba(100, 230, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        #mutate-btn:hover:not(:disabled) {
            background: rgba(100, 230, 255, 0.25);
            transform: translateY(-1px);
        }
        
        #mutate-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        #mutate-btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }

        #lore-display {
            font-size: 0.85rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.4);
            padding: 14px;
            border-radius: 8px;
            border-left: 3px solid rgba(100, 230, 255, 0.5);
            margin-top: 12px;
            max-height: 140px;
            overflow-y: auto;
        }

        #lore-display strong {
            color: #fff;
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="top-hint">Tap canvas to guide growth</div>

    <div id="ui-container">
        
        <!-- The panel floats above the dock -->
        <div id="panel-content" class="collapsed">
            <textarea id="env-input" rows="3" placeholder="Describe an environment (e.g., Toxic neon city ruins)..."></textarea>
            <div style="display: flex; gap: 10px; margin: 10px 0;">
                <label for="model-select" style="display: flex; align-items: center; color: rgba(255,255,255,0.7); font-size: 0.9rem; white-space: nowrap;">Model:</label>
                <select id="model-select" style="flex: 1; padding: 8px; background: rgba(15, 15, 20, 0.8); color: white; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; cursor: pointer;">
                    <option value="">Loading models...</option>
                </select>
            </div>
            <button id="mutate-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Evolve AI Structure
            </button>
            <div id="lore-display">
                <strong>Stellaris Arboria</strong>
                A resilient strain adapted to the vacuum of space, drawing energy from ambient starlight.
            </div>
        </div>

        <!-- The main bottom dock -->
        <div id="toolbar">
            <button id="btn-toggle" class="dock-btn" title="Open Xenobotany Lab">
                <div class="toggle-left">
                    <span>🧬</span>
                    <span>Xenobotany Lab</span>
                </div>
                <svg id="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
            
            <button id="btn-iterative-mutate" class="dock-btn icon-btn" title="Iterative Mutation (Evolve environment further)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>
            
            <button id="btn-reset" class="dock-btn icon-btn" title="Clear Canvas">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
        </div>

    </div>

    <canvas id="treeCanvas"></canvas>

    <!-- Load puter.js library before any AI-related scripts -->
    <script src="https://js.puter.com/v2/"></script>

    <script>
        // --- Vector Math ---
        class Vector {
            constructor(x, y) { this.x = x; this.y = y; }
            static dist(v1, v2) { return Math.sqrt((v1.x - v2.x) ** 2 + (v1.y - v2.y) ** 2); }
            static sub(v1, v2) { return new Vector(v1.x - v2.x, v1.y - v2.y); }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            div(n) { this.x /= n; this.y /= n; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() { const m = this.mag(); if (m !== 0) this.div(m); return this; }
            copy() { return new Vector(this.x, this.y); }
        }

        // --- Core Classes ---
        class Attractor {
            constructor(x, y) {
                this.pos = new Vector(x, y);
                this.life = 1.0; 
            }
            draw(ctx) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.4 * this.life})`;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Branch {
            constructor(pos, parent, dir, depth = 0) {
                this.pos = pos;
                this.parent = parent;
                this.dir = dir.copy();
                this.originalDir = dir.copy();
                this.count = 0;
                this.len = 5; 
                this.depth = depth;
                this.leafData = null; 
            }
            reset() {
                this.dir = this.originalDir.copy();
                this.count = 0;
            }
            next() {
                const nextDir = this.dir.copy().mult(this.len);
                const nextPos = this.pos.copy().add(nextDir);
                return new Branch(nextPos, this, this.dir.copy(), this.depth + 1);
            }
        }

        // --- Main Simulation ---
        class Simulation {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.attractors = [];
                this.branches = [];
                
                this.max_dist = 180;
                this.min_dist = 12;
                this.baseWidth = 8;    
                this.taperRate = 0.96; 
                this.minWidth = 0.5;   
                
                this.theme = {
                    branchColor: "rgba(180, 190, 200, 0.8)",
                    glowColor: "rgba(0, 255, 255, 0.9)",
                    leafFill: "rgba(100, 230, 255, 0.25)",
                    leafStroke: "rgba(200, 255, 255, 0.5)"
                };

                this.setupEventListeners();
                this.setupGemini();
                this.init();
            }

            resetTree() {
                this.branches = [];
                this.attractors = [];
                
                // Keep the canvas sized right and immediately spawn the root
                const rootPos = new Vector(this.canvas.width / 2, this.canvas.height - 20);
                const rootDir = new Vector(0, -1);
                this.branches.push(new Branch(rootPos, null, rootDir, 0));
                
                // Clear the screen instantly
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            generateFromAIStructures(structures) {
                const w = this.canvas.width;
                const h = this.canvas.height;

                for (const struct of structures) {
                    const count = struct.particleCount;
                    const cx = struct.centerX * w;
                    const cy = struct.centerY * h;
                    const sw = struct.width * w;
                    const sh = struct.height * h;

                    for (let i = 0; i < count; i++) {
                        let px, py;
                        
                        if (struct.shapeType === 'ellipse') {
                            const r = Math.sqrt(Math.random());
                            const theta = Math.random() * Math.PI * 2;
                            px = cx + r * (sw / 2) * Math.cos(theta);
                            py = cy + r * (sh / 2) * Math.sin(theta);
                        } else if (struct.shapeType === 'ring') {
                            const r = 0.7 + 0.3 * Math.random();
                            const theta = Math.random() * Math.PI * 2;
                            px = cx + r * (sw / 2) * Math.cos(theta);
                            py = cy + r * (sh / 2) * Math.sin(theta);
                        } else if (struct.shapeType === 'rectangle') {
                            px = cx + (Math.random() - 0.5) * sw;
                            py = cy + (Math.random() - 0.5) * sh;
                        } else {
                            px = cx + (Math.random() - 0.5) * sw;
                            py = cy + (Math.random() - 0.5) * sh;
                        }

                        px = Math.max(20, Math.min(w - 20, px));
                        py = Math.max(20, Math.min(h - 20, py));
                        
                        this.attractors.push(new Attractor(px, py));
                    }
                }
            }

            async initializeAIModels() {
                const modelSelect = document.getElementById('model-select');
                const loreDisplay = document.getElementById('lore-display');
                try {
                    // Fetch available models from Puter v2 API
                    const models = await puter.ai.listModels();
                    
                    // Clear existing options
                    modelSelect.innerHTML = '';
                    
                    // Populate select with model options
                    models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id || model.name;
                        option.textContent = model.name || model.id;
                        modelSelect.appendChild(option);
                    });
                    
                    // Set default model based on priority:
                    // 1. Check localStorage for 'treelabModel'
                    let savedModel = localStorage.getItem('treelabModel');
                    if (savedModel && models.some(m => (m.id || m.name) === savedModel)) {
                        modelSelect.value = savedModel;
                    } else if (models.length > 0) {
                        // 2. Use first available model in the select options
                        modelSelect.value = models[0].id || models[0].name;
                        // Persist the default selection
                        localStorage.setItem('treelabModel', modelSelect.value);
                    }
                } catch (e) {
                    console.error('Failed to load AI models:', e);
                    modelSelect.innerHTML = '<option value="">AI not ready</option>';
                    loreDisplay.innerHTML = '<strong style="color: #ff9999;">AI not ready:</strong> please sign in to Puter and pick a model';
                }
            }

            setupGemini() {
                const btn = document.getElementById('mutate-btn');
                const input = document.getElementById('env-input');
                const loreDisplay = document.getElementById('lore-display');
                
                const uiContainer = document.getElementById('ui-container');
                const panel = document.getElementById('panel-content');
                const btnToggle = document.getElementById('btn-toggle');
                const btnReset = document.getElementById('btn-reset');
                const btnIterativeMutate = document.getElementById('btn-iterative-mutate');
                const modelSelect = document.getElementById('model-select');

                // Initialize AI models on page load
                this.initializeAIModels();

                // Panel toggle logic
                btnToggle.addEventListener('click', () => {
                    panel.classList.toggle('collapsed');
                    uiContainer.classList.toggle('panel-open');
                });

                btnReset.addEventListener('click', () => {
                    this.resetTree();
                });

                // Helper to trigger API sequence. isMutation flag decides how the AI behaves.
                const triggerEvolution = async (isMutation = false) => {
                    let prompt = input.value.trim();
                    
                    if (!prompt && !isMutation) return;
                    // If mutating from an empty input, provide a baseline seed
                    if (!prompt && isMutation) {
                        prompt = "A standard, lush green Earth-like terrestrial forest.";
                    }

                    btn.disabled = true;
                    btnIterativeMutate.disabled = true;
                    
                    const originalBtnContent = btn.innerHTML;
                    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> ${isMutation ? 'Mutating DNA...' : 'AI Synthesizing...'}`;
                    
                    if (!document.getElementById('spinner-style')) {
                        const style = document.createElement('style');
                        style.id = 'spinner-style';
                        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
                        document.head.appendChild(style);
                    }

                    try {
                        const newTheme = await this.callAIWithPuter(prompt, isMutation);
                        
                        // If it was a mutation, the AI invented a NEW environment. Update the text box!
                        if (isMutation && newTheme.newEnvironment) {
                            input.value = newTheme.newEnvironment;
                        }
                        
                        const safeTheme = {
                            branchColor: newTheme.branchColor || this.theme.branchColor,
                            glowColor: newTheme.glowColor || this.theme.glowColor,
                            leafFill: newTheme.leafFill || this.theme.leafFill,
                            leafStroke: newTheme.leafStroke || this.theme.leafStroke
                        };
                        this.theme = safeTheme;
                        
                        const borderGlow = (typeof safeTheme.glowColor === 'string' && safeTheme.glowColor)
                            ? safeTheme.glowColor
                            : "rgba(255, 255, 255, 0.7)";
                        loreDisplay.style.borderColor = borderGlow.replace(/[\d\.]+\)$/g, '0.7)');
                        
                        const speciesName = (newTheme.speciesName || 'Unknown Species');
                        const lore = (newTheme.lore || '');
                        loreDisplay.innerHTML = `<strong>${speciesName}</strong>${lore}`;
                        
                        this.resetTree();
                        if (newTheme.structures && newTheme.structures.length > 0) {
                            this.generateFromAIStructures(newTheme.structures);
                        }

                        // Auto-collapse on small mobile after generating to enjoy the view
                        if (window.innerWidth <= 600) {
                            setTimeout(() => {
                                panel.classList.add('collapsed');
                                uiContainer.classList.remove('panel-open');
                                input.blur(); 
                            }, 1500);
                        }
                        
                    } catch (e) {
                        loreDisplay.innerHTML = `<span style="color: #ff6b6b;">Evolution failed: ${e.message}</span>`;
                    } finally {
                        btn.disabled = false;
                        btnIterativeMutate.disabled = false;
                        btn.innerHTML = originalBtnContent;
                    }
                };

                // The mutation button triggers the API with the mutation flag
                btnIterativeMutate.addEventListener('click', () => {
                    panel.classList.remove('collapsed');
                    uiContainer.classList.add('panel-open');
                    triggerEvolution(true);
                });

                // Standard evolve button
                btn.addEventListener('click', () => triggerEvolution(false));
                
                // Model selection change: persist to localStorage
                modelSelect.addEventListener('change', () => {
                    localStorage.setItem('treelabModel', modelSelect.value);
                });
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        btn.click();
                    }
                });

                // Prevent canvas clicks when interacting with the UI
                const stopPropagation = (e) => e.stopPropagation();
                uiContainer.addEventListener('mousedown', stopPropagation);
                uiContainer.addEventListener('touchstart', stopPropagation, { passive: false });
                uiContainer.addEventListener('click', stopPropagation);

                input.addEventListener('focus', () => {
                    window.scrollTo(0, 0);
                    panel.classList.remove('collapsed');
                    uiContainer.classList.add('panel-open');
                });
            }

            async callAIWithPuter(promptText, isMutation) {
                const modelSelect = document.getElementById('model-select');
                let selectedModel = modelSelect?.value;

                if (!selectedModel) selectedModel = localStorage.getItem('treelabModel');
                if (!selectedModel && modelSelect?.options?.length > 0) selectedModel = modelSelect.options[0].value;
                if (!selectedModel) {
                    throw new Error('AI not ready: please sign in to Puter and pick a model');
                }

                const jsonSchema = `\n\nReturn ONLY valid JSON (no markdown, no extra text) with this exact shape:\n{\n  "newEnvironment": string,\n  "speciesName": string,\n  "lore": string,\n  "branchColor": "rgba(r,g,b,a)",\n  "glowColor": "rgba(r,g,b,a)",\n  "leafFill": "rgba(r,g,b,a)",\n  "leafStroke": "rgba(r,g,b,a)",\n  "structures": [\n    {"shapeType":"ellipse|ring|rectangle","centerX":0-1,"centerY":0-1,"width":0-1,"height":0-1,"particleCount":integer}\n  ]\n}`;

                let promptString = "";
                if (isMutation) {
                    promptString = `You are an expert alien botanist studying rapid chaotic evolution.
The CURRENT environment is: "${promptText}".

1) MUTATE this environment. Introduce a catastrophic event, a surprising twist, or an extreme shift to the biome while keeping remnants of the original idea. Provide this updated, mutated description as "newEnvironment".
2) EVOLVE a sci-fi plant species adapted to this newly mutated environment.
3) Provide "speciesName", a short lore description (max 2 sentences) as "lore", and color parameters using valid rgba CSS strings.
4) Design its 2D growth structure by defining geometric target clusters (where the foliage/energy gathers).
   - The plant will grow a trunk from bottom-center (x: 0.5, y: 1.0) upwards.
   - Use relative coordinates from 0.0 to 1.0.
   - shapeType can be "ellipse", "ring", or "rectangle".
   - Generate 1 to 4 structures that physically fit the mutated theme.
   - Total particleCount should sum to roughly 400.${jsonSchema}`;
                } else {
                    promptString = `You are an expert alien botanist. The user has described an environment: "${promptText}".
1) Create a sci-fi plant species adapted to this environment. Set "newEnvironment" to exactly what the user provided.
2) Provide "speciesName", a short lore description (max 2 sentences) as "lore", and color parameters using valid rgba CSS strings.
3) Design its 2D growth structure by defining geometric target clusters (where the foliage/energy gathers).
   - The plant will grow a trunk from bottom-center (x: 0.5, y: 1.0) upwards.
   - Use relative coordinates from 0.0 to 1.0.
   - shapeType can be "ellipse", "ring", or "rectangle".
   - Generate 1 to 4 structures that physically fit the theme.
   - Total particleCount should sum to roughly 400.${jsonSchema}`;
                }

                const extractJsonObject = (s) => {
                    if (typeof s !== 'string') return '';
                    const first = s.indexOf('{');
                    const last = s.lastIndexOf('}');
                    if (first === -1 || last === -1 || last <= first) return '';
                    return s.slice(first, last + 1);
                };

                const response = await puter.ai.chat(promptString, { model: selectedModel });
                let text = response?.text ?? response;
                if (typeof text !== 'string') text = JSON.stringify(text);

                const jsonText = extractJsonObject(text) || text;
                let parsed;
                try {
                    parsed = JSON.parse(jsonText);
                } catch (e) {
                    throw new Error('AI returned non-JSON output. Try a different model.');
                }

                const result = {
                    newEnvironment: parsed.newEnvironment ?? promptText,
                    speciesName: parsed.speciesName ?? 'Unknown Species',
                    lore: parsed.lore ?? '',
                    branchColor: parsed.branchColor ?? this.theme.branchColor,
                    glowColor: parsed.glowColor ?? this.theme.glowColor,
                    leafFill: parsed.leafFill ?? this.theme.leafFill,
                    leafStroke: parsed.leafStroke ?? this.theme.leafStroke,
                    structures: Array.isArray(parsed.structures) ? parsed.structures : []
                };

                if (!Array.isArray(result.structures) || result.structures.length === 0) {
                    throw new Error('AI response missing structures. Try a different model.');
                }

                return result;
            }

            setupEventListeners() {
                this.canvas.addEventListener('mousedown', (e) => {
                    this.addAttractorCluster(e.clientX, e.clientY);
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.target === this.canvas) {
                        e.preventDefault(); 
                        const touch = e.touches[0];
                        this.addAttractorCluster(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                    this.ctx.fillStyle = "black";
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                });
            }

            addAttractorCluster(centerX, centerY) {
                const count = 5 + Math.floor(Math.random() * 8);
                const spread = 45;

                for (let i = 0; i < count; i++) {
                    const r = Math.random() * spread;
                    const theta = Math.random() * 2 * Math.PI;
                    const x = centerX + r * Math.cos(theta);
                    const y = centerY + r * Math.sin(theta);
                    this.attractors.push(new Attractor(x, y));
                }
            }

            init() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.resetTree();
                this.animate();
            }

            update() {
                if (this.attractors.length === 0) return;

                this.branches.forEach(b => b.reset());

                for (let i = this.attractors.length - 1; i >= 0; i--) {
                    const attractor = this.attractors[i];
                    let closestBranch = null;
                    let recordDist = this.max_dist;

                    for (let branch of this.branches) {
                        const d = Vector.dist(attractor.pos, branch.pos);
                        
                        if (d < this.min_dist) {
                            this.attractors.splice(i, 1);
                            closestBranch = null;
                            break;
                        } 
                        
                        if (d < recordDist) {
                            closestBranch = branch;
                            recordDist = d;
                        }
                    }

                    if (closestBranch) {
                        const newDir = Vector.sub(attractor.pos, closestBranch.pos);
                        newDir.normalize();
                        closestBranch.dir.add(newDir);
                        closestBranch.count++;
                    }
                }

                const newBranches = [];
                for (let i = 0; i < this.branches.length; i++) {
                    const branch = this.branches[i];
                    if (branch.count > 0) {
                        branch.dir.div(branch.count);
                        branch.dir.normalize();
                        
                        const candidate = branch.next();
                        
                        let tooClose = false;
                        for (let existing of this.branches) {
                            if (Vector.dist(candidate.pos, existing.pos) < branch.len * 0.8) {
                                tooClose = true;
                                break;
                            }
                        }

                        if (!tooClose) {
                            newBranches.push(candidate);
                        }
                        
                        branch.reset();
                    }
                }
                
                this.branches.push(...newBranches);
            }

            animate() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.animate());
            }

            render() {
                this.ctx.fillStyle = "rgba(5, 5, 5, 1)";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const parents = new Set();
                for (let b of this.branches) {
                    if (b.parent) parents.add(b.parent);
                }

                this.attractors.forEach(a => a.draw(this.ctx));

                this.ctx.strokeStyle = this.theme.branchColor; 
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';

                for (let branch of this.branches) {
                    if (branch.parent) {
                        const thickness = Math.max(
                            this.minWidth, 
                            this.baseWidth * Math.pow(this.taperRate, branch.depth)
                        );
                        
                        this.ctx.lineWidth = thickness;
                        this.ctx.beginPath();
                        this.ctx.moveTo(branch.parent.pos.x, branch.parent.pos.y);
                        this.ctx.lineTo(branch.pos.x, branch.pos.y);
                        this.ctx.stroke();
                    }
                }

                this.ctx.save();
                this.ctx.shadowBlur = 15;
                this.ctx.shadowColor = this.theme.glowColor; 
                this.ctx.fillStyle = this.theme.leafFill; 
                this.ctx.strokeStyle = this.theme.leafStroke;
                this.ctx.lineWidth = 1;

                for (let branch of this.branches) {
                    if (!parents.has(branch) && branch.depth > 5) {
                        if (!branch.leafData) {
                            branch.leafData = [];
                            const shardCount = 8 + Math.floor(Math.random() * 6);
                            const baseAngle = Math.atan2(branch.dir.y, branch.dir.x);
                            
                            for (let i = 0; i < shardCount; i++) {
                                branch.leafData.push({
                                    angleOffset: Math.random() * Math.PI * 2,
                                    radius: Math.random() * 14,
                                    rotation: baseAngle + (Math.random() - 0.5) * 2,
                                    size: 3 + Math.random() * 7
                                });
                            }
                        }

                        for (let shard of branch.leafData) {
                            const shardPos = new Vector(
                                branch.pos.x + Math.cos(shard.angleOffset) * shard.radius,
                                branch.pos.y + Math.sin(shard.angleOffset) * shard.radius
                            );
                            this.drawShard(shardPos, shard.rotation, shard.size);
                        }
                    }
                }
                this.ctx.restore();
            }

            drawShard(pos, angle, size) {
                this.ctx.save();
                this.ctx.translate(pos.x, pos.y);
                this.ctx.rotate(angle);
                
                this.ctx.beginPath();
                this.ctx.moveTo(0, 0);
                this.ctx.lineTo(size, -size * 0.4);
                this.ctx.lineTo(size * 1.8, 0);
                this.ctx.lineTo(size, size * 0.4);
                this.ctx.closePath();
                
                this.ctx.fill();
                this.ctx.stroke();
                this.ctx.restore();
            }
        }

        window.onload = () => {
            new Simulation('treeCanvas');
        };
    </script>
</body>
</html>
